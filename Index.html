<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Live Room Detector (iPhone)</title>
  <style>
    :root{
      --bg0:#070612;
      --bg1:#0b0a1d;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --accent:#7c4dff;
      --accent2:#00e5ff;
      --good:#2dff9a;
      --warn:#ffd166;
      --bad:#ff4d6d;
      --r:18px;
      --shadow: 0 18px 70px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, rgba(124,77,255,.25), transparent 60%),
                  radial-gradient(900px 700px at 90% 20%, rgba(0,229,255,.18), transparent 55%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    }
    .app{
      width:min(980px, 100%);
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 14px;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border-radius: var(--r);
      box-shadow: var(--shadow);
    }
    .title{
      display:flex; gap:10px; align-items:center;
      font-weight:800; letter-spacing:.3px;
    }
    .dot{
      width:12px;height:12px;border-radius:999px;
      background: radial-gradient(circle at 30% 30%, var(--good), rgba(45,255,154,.2));
      box-shadow: 0 0 18px rgba(45,255,154,.55);
    }
    .sub{
      color:var(--muted);
      font-size:12px;
    }

    .stage{
      position:relative;
      width:100%;
      aspect-ratio: 16 / 9; /* updated after video metadata loads */
      border-radius: calc(var(--r) + 6px);
      overflow:hidden;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.35);
      box-shadow: var(--shadow);
    }
    video, canvas{
      position:absolute; inset:0;
      width:100%; height:100%;
    }
    video{
      object-fit: fill; /* stage keeps correct aspect ratio */
      background: rgba(0,0,0,.2);
    }
    canvas{
      pointer-events:none;
    }
    .hud{
      position:absolute; left:10px; top:10px;
      display:flex; gap:8px; flex-wrap:wrap;
      z-index:5;
    }
    .pill{
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      padding:6px 10px;
      border-radius: 999px;
      font-size:12px;
      color: var(--text);
    }

    .panel{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      padding:12px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      border-radius: var(--r);
    }
    button, select, input[type="range"]{
      border-radius: 12px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.25);
      color: var(--text);
      padding:10px 12px;
      font-size:14px;
      outline:none;
    }
    button{
      cursor:pointer;
      background: linear-gradient(180deg, rgba(124,77,255,.45), rgba(124,77,255,.15));
      border-color: rgba(124,77,255,.35);
    }
    button.secondary{
      background: rgba(0,0,0,.25);
      border-color: var(--stroke);
    }
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }
    .field{
      display:flex; gap:8px; align-items:center;
      padding:8px 10px;
      border:1px solid var(--stroke);
      border-radius: 12px;
      background: rgba(0,0,0,.18);
    }
    .field label{
      font-size:12px; color: var(--muted);
      margin-right:2px;
      white-space:nowrap;
    }
    .field .val{
      font-variant-numeric: tabular-nums;
      font-size:12px; color: var(--text);
      min-width:46px;
      text-align:right;
    }
    details{
      border:1px solid var(--stroke);
      border-radius: var(--r);
      background: rgba(255,255,255,.04);
      overflow:hidden;
    }
    summary{
      padding:10px 12px;
      cursor:pointer;
      color: var(--muted);
      user-select:none;
    }
    pre{
      margin:0;
      padding:10px 12px;
      color: rgba(255,255,255,.75);
      font-size:12px;
      overflow:auto;
      max-height: 220px;
      background: rgba(0,0,0,.25);
      border-top:1px solid var(--stroke);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div>
        <div class="title">
          <div class="dot"></div>
          <div>Live Room Detector</div>
        </div>
        <div class="sub">Objects (includes “person”) + Faces • runs on-device in your browser</div>
      </div>
      <div class="sub" id="hint">Tip: host on HTTPS (GitHub Pages/Netlify) to use iPhone camera.</div>
    </div>

    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div class="hud">
        <div class="pill" id="status">Status: idle</div>
        <div class="pill" id="fps">FPS: --</div>
        <div class="pill" id="modePill">Mode: both</div>
      </div>
    </div>

    <div class="panel">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" class="secondary" disabled>Stop</button>

      <div class="field">
        <label for="modeSel">Mode</label>
        <select id="modeSel">
          <option value="objects">Objects (includes person)</option>
          <option value="faces">Faces</option>
          <option value="both" selected>Objects + Faces</option>
        </select>
      </div>

      <div class="field">
        <label for="camSel">Camera</label>
        <select id="camSel">
          <option value="environment" selected>Back</option>
          <option value="user">Front</option>
        </select>
      </div>

      <div class="field" style="flex:1; min-width: 240px;">
        <label for="thr">Min score</label>
        <input id="thr" type="range" min="0.10" max="0.90" step="0.05" value="0.50" style="width: 100%;">
        <div class="val" id="thrVal">0.50</div>
      </div>
    </div>

    <details>
      <summary>Debug log</summary>
      <pre id="log"></pre>
    </details>
  </div>

  <script type="module">
    // MediaPipe Tasks Vision (ObjectDetector + FaceDetector)
    // Docs: https://ai.google.dev/edge/mediapipe/solutions/vision/object_detector/web_js
    //      https://ai.google.dev/edge/mediapipe/solutions/vision/face_detector/web_js

    import { ObjectDetector, FaceDetector, FilesetResolver } from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32";

    const OBJECT_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite";
    const FACE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite";

    const el = (id) => document.getElementById(id);
    const video = el("video");
    const stage = el("stage");
    const canvas = el("overlay");
    const ctx = canvas.getContext("2d");

    const startBtn = el("startBtn");
    const stopBtn  = el("stopBtn");
    const modeSel  = el("modeSel");
    const camSel   = el("camSel");
    const thr      = el("thr");
    const thrVal   = el("thrVal");

    const statusEl = el("status");
    const fpsEl    = el("fps");
    const modePill = el("modePill");
    const logEl    = el("log");

    let stream = null;
    let running = false;
    let rafId = null;

    let objectDetector = null;
    let faceDetector = null;

    let lastObj = null;
    let lastFace = null;

    let lastObjRun = 0;
    let lastFaceRun = 0;

    // Tune these if you want more speed vs more accuracy
    const OBJ_INTERVAL_MS  = 90;  // ~11 fps object detection
    const FACE_INTERVAL_MS = 55;  // ~18 fps face detection

    // FPS counter
    let fpsFrames = 0;
    let fpsLastT = performance.now();

    function log(msg){
      const t = new Date().toLocaleTimeString();
      logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
    }

    function setStatus(msg){
      statusEl.textContent = `Status: ${msg}`;
    }

    function setModePill(){
      modePill.textContent = `Mode: ${modeSel.value}`;
    }

    function resizeStageToVideo(){
      const vw = video.videoWidth || 1280;
      const vh = video.videoHeight || 720;
      stage.style.aspectRatio = `${vw} / ${vh}`;

      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      // Draw in video pixel units:
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function clear(){
      ctx.clearRect(0, 0, video.videoWidth, video.videoHeight);
    }

    function drawLabel(x, y, text, bg = "rgba(0,0,0,.55)"){
      ctx.font = "14px ui-sans-serif, system-ui";
      ctx.textBaseline = "top";
      const padX = 8, padY = 5;
      const w = ctx.measureText(text).width + padX*2;
      const h = 14 + padY*2;

      ctx.fillStyle = bg;
      ctx.fillRect(x, y, w, h);

      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.fillText(text, x + padX, y + padY);
    }

    function drawBox(b, color){
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(b.originX, b.originY, b.width, b.height);
    }

    function drawDetections(){
      clear();

      const minScore = parseFloat(thr.value);

      // Objects (includes person)
      if ((modeSel.value === "objects" || modeSel.value === "both") && lastObj?.detections){
        for (const det of lastObj.detections){
          const cat = det.categories?.[0];
          if (!cat) continue;
          if (cat.score < minScore) continue;

          drawBox(det.boundingBox, "rgba(45,255,154,.95)");
          const label = `${cat.categoryName} ${(cat.score*100).toFixed(0)}%`;
          drawLabel(det.boundingBox.originX, Math.max(0, det.boundingBox.originY - 22), label, "rgba(0,0,0,.55)");
        }
      }

      // Faces (+ keypoints)
      if ((modeSel.value === "faces" || modeSel.value === "both") && lastFace?.detections){
        for (const det of lastFace.detections){
          const score = det.categories?.[0]?.score ?? 1;
          if (score < minScore) continue;

          drawBox(det.boundingBox, "rgba(255,209,102,.95)");
          drawLabel(det.boundingBox.originX, Math.max(0, det.boundingBox.originY - 22), `face ${(score*100).toFixed(0)}%`, "rgba(0,0,0,.55)");

          // Optional landmarks / keypoints if available:
          if (Array.isArray(det.keypoints)){
            ctx.fillStyle = "rgba(0,229,255,.95)";
            for (const kp of det.keypoints){
              // keypoints are typically in image pixels for Tasks Vision results
              const r = 3.2;
              ctx.beginPath();
              ctx.arc(kp.x, kp.y, r, 0, Math.PI*2);
              ctx.fill();
            }
          }
        }
      }
    }

    async function initDetectors(){
      setStatus("loading models…");

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm"
      );

      // Try GPU first, fall back to CPU if needed
      const makeObject = async (delegate) => ObjectDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: OBJECT_MODEL_URL, delegate },
        runningMode: "VIDEO",
        scoreThreshold: 0.2,
        maxResults: 8
      });

      const makeFace = async (delegate) => FaceDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate },
        runningMode: "VIDEO",
        minDetectionConfidence: 0.2
      });

      try{
        objectDetector = await makeObject("GPU");
        faceDetector   = await makeFace("GPU");
        log("Detectors initialized (GPU).");
      }catch(e){
        log("GPU init failed, retrying with CPU…");
        objectDetector = await makeObject("CPU");
        faceDetector   = await makeFace("CPU");
        log("Detectors initialized (CPU).");
      }

      setStatus("ready");
    }

    async function startCamera(){
      if (!objectDetector || !faceDetector){
        await initDetectors();
      }

      const facingMode = camSel.value; // "environment" or "user"
      setStatus("requesting camera…");

      // Stop old stream if any
      stopCamera();

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      await video.play();

      // Wait for dimensions
      await new Promise((res) => {
        if (video.videoWidth) return res();
        video.onloadedmetadata = () => res();
      });

      resizeStageToVideo();
      setModePill();

      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;

      lastObj = null;
      lastFace = null;
      lastObjRun = 0;
      lastFaceRun = 0;

      fpsFrames = 0;
      fpsLastT = performance.now();

      setStatus("running");
      log(`Camera started (${facingMode}).`);
      rafId = requestAnimationFrame(loop);
    }

    function stopCamera(){
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;

      if (video){
        video.pause();
        video.srcObject = null;
      }
      if (stream){
        for (const track of stream.getTracks()) track.stop();
        stream = null;
      }

      clear();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus("idle");
      log("Camera stopped.");
    }

    function loop(now){
      if (!running) return;

      // FPS UI
      fpsFrames++;
      const dt = now - fpsLastT;
      if (dt >= 500){
        fpsEl.textContent = `FPS: ${(fpsFrames * 1000 / dt).toFixed(1)}`;
        fpsFrames = 0;
        fpsLastT = now;
      }

      // Only run inference when video is ready
      if (video.readyState >= 2){
        // Object detection
        if ((modeSel.value === "objects" || modeSel.value === "both") && (now - lastObjRun >= OBJ_INTERVAL_MS)){
          try{
            lastObj = objectDetector.detectForVideo(video, now);
          }catch(e){
            log("Object detect error: " + (e?.message || e));
          }
          lastObjRun = now;
        }

        // Face detection
        if ((modeSel.value === "faces" || modeSel.value === "both") && (now - lastFaceRun >= FACE_INTERVAL_MS)){
          try{
            lastFace = faceDetector.detectForVideo(video, now);
          }catch(e){
            log("Face detect error: " + (e?.message || e));
          }
          lastFaceRun = now;
        }

        drawDetections();
      }

      rafId = requestAnimationFrame(loop);
    }

    // UI wiring
    startBtn.addEventListener("click", () => startCamera().catch(err => {
      setStatus("camera error");
      log("getUserMedia failed: " + (err?.message || err));
      alert("Camera failed. Make sure you're on HTTPS and allowed camera access.");
    }));
    stopBtn.addEventListener("click", stopCamera);

    modeSel.addEventListener("change", () => {
      setModePill();
      log(`Mode set: ${modeSel.value}`);
    });

    camSel.addEventListener("change", async () => {
      log(`Camera set: ${camSel.value}`);
      if (running){
        await startCamera().catch(e => log("Restart camera failed: " + (e?.message || e)));
      }
    });

    thr.addEventListener("input", () => {
      thrVal.textContent = parseFloat(thr.value).toFixed(2);
    });

    // Initial UI state
    thrVal.textContent = parseFloat(thr.value).toFixed(2);
    setModePill();
    setStatus("idle (press Start Camera)");
    log("Loaded. Press Start Camera.");
  </script>
</body>
</html>
