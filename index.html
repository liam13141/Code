<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Live Detector (iPhone-friendly)</title>
  <style>
    :root{--bg:#070612;--card:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.12);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.65);--good:#2dff9a;--warn:#ffd166;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,#070612,#0b0a1d);color:var(--text);padding:12px}
    .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
    .bar{border:1px solid var(--stroke);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border-radius:16px;padding:12px}
    .title{font-weight:800}
    .sub{color:var(--muted);font-size:12px;margin-top:4px}
    .stage{position:relative;border:1px solid var(--stroke);border-radius:20px;overflow:hidden;background:rgba(0,0,0,.35)}
    video,canvas{position:absolute;inset:0;width:100%;height:100%}
    video{object-fit:cover}
    .hud{position:absolute;left:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
    .pill{border:1px solid var(--stroke);background:rgba(0,0,0,.35);backdrop-filter:blur(8px);padding:6px 10px;border-radius:999px;font-size:12px}
    .panel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--stroke);background:rgba(255,255,255,.05);border-radius:16px;padding:10px}
    button,select{border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--text);padding:10px 12px;font-size:14px}
    button{background:linear-gradient(180deg,rgba(45,255,154,.25),rgba(45,255,154,.10));border-color:rgba(45,255,154,.35);cursor:pointer}
    button.secondary{background:rgba(0,0,0,.25);border-color:var(--stroke)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .field{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--stroke);border-radius:12px;background:rgba(0,0,0,.18)}
    .field label{font-size:12px;color:var(--muted);white-space:nowrap}
    input[type="range"]{width:190px}
    pre{margin:0;white-space:pre-wrap;color:rgba(255,255,255,.75);font-size:12px;max-height:180px;overflow:auto}
  </style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="title">Live Detector (iPhone-friendly)</div>
    <div class="sub">If you run detection too fast, Safari “freezes” because detection blocks the UI thread. This version throttles it. :contentReference[oaicite:1]{index=1}</div>
  </div>

  <div class="stage" id="stage" style="aspect-ratio:16/9;">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="pill" id="status">Status: idle</div>
      <div class="pill" id="detCount">Detections: 0</div>
      <div class="pill" id="fps">Draw FPS: --</div>
    </div>
  </div>

  <div class="panel">
    <button id="start">Start Camera</button>
    <button id="stop" class="secondary" disabled>Stop</button>

    <div class="field">
      <label>Mode</label>
      <select id="mode">
        <option value="objects" selected>Objects (includes “person”)</option>
        <option value="faces">Faces</option>
        <option value="both">Objects + Faces (slower)</option>
      </select>
    </div>

    <div class="field">
      <label>Camera</label>
      <select id="cam">
        <option value="environment" selected>Back</option>
        <option value="user">Front</option>
      </select>
    </div>

    <div class="field">
      <label>Min score</label>
      <input id="score" type="range" min="0.10" max="0.90" step="0.05" value="0.25">
      <span id="scoreVal" style="font-size:12px;color:var(--muted)">0.25</span>
    </div>

    <div class="field">
      <label>Detections/sec</label>
      <input id="rate" type="range" min="1" max="10" step="1" value="3">
      <span id="rateVal" style="font-size:12px;color:var(--muted)">3</span>
    </div>
  </div>

  <div class="bar">
    <div class="sub" style="margin-bottom:8px;">Debug log (if something fails, it will show here)</div>
    <pre id="log"></pre>
  </div>
</div>

<script type="module">
  import { ObjectDetector, FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32";

  const OBJECT_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";
  const FACE_MODEL_URL   = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";

  const $ = (id) => document.getElementById(id);
  const video = $("video");
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");

  const stage = $("stage");
  const statusEl = $("status");
  const detCountEl = $("detCount");
  const fpsEl = $("fps");
  const logEl = $("log");

  const startBtn = $("start");
  const stopBtn = $("stop");
  const modeSel = $("mode");
  const camSel = $("cam");
  const score = $("score");
  const scoreVal = $("scoreVal");
  const rate = $("rate");
  const rateVal = $("rateVal");

  let stream = null;
  let running = false;

  let objectDetector = null;
  let faceDetector = null;

  let lastObjResult = null;
  let lastFaceResult = null;

  // draw fps
  let frames = 0, lastFpsT = performance.now();

  function log(msg){
    const t = new Date().toLocaleTimeString();
    logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
  }
  function setStatus(s){ statusEl.textContent = `Status: ${s}`; }

  function resizeToVideo(){
    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;
    stage.style.aspectRatio = `${vw}/${vh}`;
    canvas.width = vw;
    canvas.height = vh;
  }

  function drawBox(x,y,w,h,color){
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(x,y,w,h);
  }
  function drawLabel(x,y,text,bg="rgba(0,0,0,.55)"){
    ctx.font = "16px system-ui,-apple-system";
    ctx.textBaseline = "top";
    const padX=8,padY=5;
    const tw = ctx.measureText(text).width;
    const bw = tw + padX*2;
    const bh = 16 + padY*2;
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, bw, bh);
    ctx.fillStyle = "rgba(255,255,255,.95)";
    ctx.fillText(text, x+padX, y+padY);
  }

  function draw(){
    if (!running) return;
    if (video.readyState >= 2){
      // FPS UI
      frames++;
      const now = performance.now();
      const dt = now - lastFpsT;
      if (dt > 600){
        fpsEl.textContent = `Draw FPS: ${(frames*1000/dt).toFixed(1)}`;
        frames = 0; lastFpsT = now;
      }

      // clear
      ctx.clearRect(0,0,canvas.width,canvas.height);

      const minScore = parseFloat(score.value);
      let count = 0;

      // Objects
      if ((modeSel.value === "objects" || modeSel.value === "both") && lastObjResult?.detections){
        for (const det of lastObjResult.detections){
          const c = det.categories?.[0];
          if (!c || c.score < minScore) continue;
          count++;
          const b = det.boundingBox;
          drawBox(b.originX, b.originY, b.width, b.height, "rgba(45,255,154,.95)");
          drawLabel(b.originX, Math.max(0, b.originY - 26), `${c.categoryName} ${(c.score*100).toFixed(0)}%`);
        }
      }

      // Faces
      if ((modeSel.value === "faces" || modeSel.value === "both") && lastFaceResult?.detections){
        for (const det of lastFaceResult.detections){
          const s = det.categories?.[0]?.score ?? 1;
          if (s < minScore) continue;
          count++;
          const b = det.boundingBox;
          drawBox(b.originX, b.originY, b.width, b.height, "rgba(255,209,102,.95)");
          drawLabel(b.originX, Math.max(0, b.originY - 26), `face ${(s*100).toFixed(0)}%`);
        }
      }

      detCountEl.textContent = `Detections: ${count}`;
    }
    requestAnimationFrame(draw);
  }

  async function initTasks(){
    setStatus("loading models…");
    log("Loading wasm + models…");

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm"
    );

    // Only load what you picked (saves a LOT of time on iPhone)
    const wantObjects = (modeSel.value === "objects" || modeSel.value === "both");
    const wantFaces   = (modeSel.value === "faces" || modeSel.value === "both");

    async function makeObj(delegate){
      return await ObjectDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: OBJECT_MODEL_URL, delegate },
        runningMode: "VIDEO",
        scoreThreshold: 0.20,
        maxResults: 8
      });
    }
    async function makeFace(delegate){
      return await FaceDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate },
        runningMode: "VIDEO",
        minDetectionConfidence: 0.20
      });
    }

    // Try GPU, fall back to CPU
    try{
      if (wantObjects) objectDetector = await makeObj("GPU");
      if (wantFaces)   faceDetector   = await makeFace("GPU");
      log("Tasks ready (GPU).");
    }catch(e){
      log("GPU failed, falling back to CPU… " + (e?.message || e));
      if (wantObjects) objectDetector = await makeObj("CPU");
      if (wantFaces)   faceDetector   = await makeFace("CPU");
      log("Tasks ready (CPU).");
    }

    setStatus("ready");
  }

  async function start(){
    log("Starting…");
    setStatus("requesting camera…");

    // stop old
    stop();

    // init detectors for current mode
    await initTasks();

    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal: camSel.value},
        width:{ideal: 640},
        height:{ideal: 480}
      }
    });

    video.srcObject = stream;
    await video.play();

    await new Promise(res => {
      if (video.videoWidth) return res();
      video.onloadedmetadata = () => res();
    });

    resizeToVideo();

    running = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;

    lastObjResult = null;
    lastFaceResult = null;

    setStatus("running");
    log("Camera running.");

    // Detection loop (THROTTLED)
    const detectionsPerSec = () => Math.max(1, parseInt(rate.value, 10) || 3);
    const tick = async () => {
      if (!running) return;

      const startMs = performance.now();
      try{
        // Objects first (most useful)
        if (objectDetector && (modeSel.value === "objects" || modeSel.value === "both")){
          lastObjResult = objectDetector.detectForVideo(video, startMs);
        }

        // Yield a tiny bit before faces so Safari doesn’t “lock up”
        await new Promise(r => setTimeout(r, 0));

        if (faceDetector && (modeSel.value === "faces" || modeSel.value === "both")){
          lastFaceResult = faceDetector.detectForVideo(video, performance.now());
        }
      }catch(e){
        log("Detection error: " + (e?.message || e));
      }

      const interval = 1000 / detectionsPerSec();
      setTimeout(tick, interval);
    };

    requestAnimationFrame(draw);
    tick();
  }

  function stop(){
    running = false;

    if (video){
      video.pause();
      video.srcObject = null;
    }
    if (stream){
      for (const t of stream.getTracks()) t.stop();
      stream = null;
    }

    objectDetector = null;
    faceDetector = null;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    startBtn.disabled = false;
    stopBtn.disabled = true;
    setStatus("idle");
  }

  // UI
  score.addEventListener("input", () => scoreVal.textContent = (+score.value).toFixed(2));
  rate.addEventListener("input", () => rateVal.textContent = rate.value);

  modeSel.addEventListener("change", () => {
    log("Mode changed to: " + modeSel.value + " (restart required)");
    // Don’t auto-restart; iPhone browsers can be picky. You can press Start again.
  });

  camSel.addEventListener("change", () => log("Camera changed to: " + camSel.value + " (restart required)"));

  startBtn.addEventListener("click", () => start().catch(err => {
    setStatus("error");
    log("Start failed: " + (err?.message || err));
    alert("Start failed. Make sure you’re on HTTPS and allowed camera access.");
  }));

  stopBtn.addEventListener("click", stop);

  // init labels
  scoreVal.textContent = (+score.value).toFixed(2);
  rateVal.textContent = rate.value;
  log("Loaded. Tip: Start with Mode = Objects and Detections/sec = 3.");
</script>
</body>
</html>
